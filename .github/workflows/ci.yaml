name: ci

on: [push,pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v7
      
    - name: set up node environment
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci


    - name: run lint
      run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install dependency
        run: npm ci

      - name: run test
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint,test]
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      
      - name: build the image
        run: docker build -t github-actions-ci .
      

      

