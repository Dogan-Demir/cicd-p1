name: ci

on: [push,pull_request]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v7
      
    - name: set up node environment
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci


    - name: run lint
      run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install dependency
        run: npm ci

      - name: run test
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint,test]
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
      
      - name: Get OIDC token
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d | jq '{sub, aud, repository, repository_owner, repository_id, repository_owner_id}'

      - name: configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with: 
          role-to-assume: arn:aws:iam::647932856976:role/GithubActionsCICD
          aws-region: eu-west-2
      
      - name: log into Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: build the image
        run: docker build -t github-actions-ci .
      
      - name: tag the image
        run: docker tag github-actions-ci 647932856976.dkr.ecr.eu-west-2.amazonaws.com/cicd-p1:latest
        
      - name: push the image to ecr
        if: github.event_name == 'push'
        run: docker push 647932856976.dkr.ecr.eu-west-2.amazonaws.com/cicd-p1:latest

      

      

      

